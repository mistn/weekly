# push 到 main 即自动部署到 Cloudflare，并把 GitHub 里的 ADMIN_PASSWORD 同步为 Worker secret
# 以后改密码只改 GitHub Secrets，push 即生效，本地再也不用 wrangler secret put
# 需要的 Secrets（仓库 Settings → Secrets and variables → Actions，跟备份共用前 5 个）：
#   CLOUDFLARE_API_TOKEN   用 “Edit Cloudflare Workers” 模板建，再手动 + 一行：帐户 / D1 / 读取
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 后台链接里那串 account id
#   ADMIN_PASSWORD         写文章的密码（注意用 printf 传，不带换行，echo 会多带个换行导致登录失败）
#   WEBDAV_URL / WEBDAV_USERNAME / WEBDAV_PASSWORD  备份用（见 backup.yml）

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {} # 手动点一次也行

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 wrangler
        run: npm install -g wrangler@3

      - name: 部署 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: 同步管理员密码
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: printf '%s' "$ADMIN_PASSWORD" | wrangler secret put ADMIN_PASSWORD
